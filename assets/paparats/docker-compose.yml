services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: workstreams-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ~/.workstreams/paparats/qdrant_storage:/qdrant/storage

  paparats-mcp:
    image: ghcr.io/paparats/paparats-mcp:latest
    container_name: workstreams-paparats-mcp
    restart: unless-stopped
    depends_on:
      - qdrant
    ports:
      - "9876:9876"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - PROJECTS_CONFIG=/config/projects.yml
      - PORT=9876
    volumes:
      - ~/.workstreams/paparats:/config
      - ~/.workstreams/efforts:/efforts:ro

