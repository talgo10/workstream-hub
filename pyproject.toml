[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workstream-hub"
version = "0.1.0"
description = "Local multi-session AI workstream orchestration, context-shunting, and hybrid-RAG memory hub"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "fastmcp>=0.4.0",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.3.6",
    "tree-sitter-language-pack>=0.6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
ws = "workstream_hub.cli_mcp:app"
ws-mcp = "workstream_hub.cli_mcp:run_mcp"
ws-ui = "workstream_hub.ui_server:run_ui"

[tool.hatch.build.targets.wheel]
packages = ["src/workstream_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
